[project]
name = "teacher"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "transformers",
    "datasets",
    "tqdm",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "pydantic>=2.0.0",
    "pydantic-ai>=1.25.1",
    "tyro>=0.9.35",
    "torch>=2.8.0",
    "liger-kernel",
    "accelerate",
    "flash-attn>=2.8.3",
    "wandb",
    "rich",
]

[project.optional-dependencies]
flash = ["flash-attn>=2.8.3"]
logging = ["colorlog"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["environment", "curriculum", "teacher_torch"]

[tool.uv]
package = true

[tool.uv.extra-build-dependencies]
flash-attn = ["torch", "setuptools", "packaging", "ninja", "psutil"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
